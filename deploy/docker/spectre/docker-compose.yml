version: "3.9"

services:
  redis:
    image: redis:7.2-alpine
    container_name: spectre-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - spectre_net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - spectre_net

  backend:
    build:
      context: ../../..
      dockerfile: deploy/docker/backend/Dockerfile.backend
    container_name: spectre-backend
    env_file:
      - ../../../.env
    environment:
      REDIS_URL: "redis://spectre-redis:6379/0"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_TIMEOUT_SECONDS: ${CLICKHOUSE_TIMEOUT_SECONDS}
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - clickhouse
    networks:
      - spectre_net

  batch:
    build:
      context: ../../..
      dockerfile: deploy/docker/batch/Dockerfile.batch
    container_name: spectre-batch
    env_file:
      - ../../../.env
    environment:
      REDIS_URL: "redis://spectre-redis:6379/0"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_TIMEOUT_SECONDS: ${CLICKHOUSE_TIMEOUT_SECONDS}
    depends_on:
      - redis
      - clickhouse
    networks:
      - spectre_net

volumes:
  redis_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  spectre_net:
    driver: bridge